<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HabitScape — gentle habit tracker and memory diary. One line a day, a memory for years.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HabitScape">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HabitScape</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Preload the Drift web stack: sqlite3.wasm + the database worker are only
    fetched when the first query runs, which stalls the cold start with a
    blank screen while the browser downloads and initializes them. Fetching
    them eagerly alongside the app makes the first paint of the board start
    as soon as the engine is up.
  -->
  <link rel="preload" href="sqlite3.wasm" as="fetch" crossorigin="anonymous" fetchpriority="high">
  <link rel="preload" href="drift_worker.js" as="script" fetchpriority="high">

  <!--
    Boot splash: a static mirror of the app's splash (StartupGate) so users
    see a themed placeholder from the very first paint — before the Flutter
    engine loads. It is hidden once Flutter has drawn its own identical
    splash (see the script at the end of <body>).
  -->
  <style>
    :root {
      --splash-bg: #FAF7F2; /* AppColors.lightBackground */
      --splash-fg: #8FAF7A; /* AppColors.sageGreen */
    }
    html[data-theme="dark"] {
      --splash-bg: #16130F; /* AppColors.darkBackground */
      --splash-fg: #AAC29A; /* AppColors.darkSage */
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --splash-bg: #16130F;
        --splash-fg: #AAC29A;
      }
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--splash-bg);
      transition: opacity 300ms ease;
    }
    #boot-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    #boot-splash .splash-flower {
      width: 56px;
      height: 56px;
      color: var(--splash-fg);
      transform-origin: 50% 50%;
      /* Gentle sway — mirrors the Flutter splash animation (StartupGate). */
      animation: splash-sway 2.4s ease-in-out infinite;
    }
    @keyframes splash-sway {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="splash-inner">
      <!-- Exact mirror of Icons.local_florist_outlined (Material Icons). -->
      <svg class="splash-flower" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 22c4.56 0 8.33-3.4 8.92-7.8.09-.64-.48-1.21-1.12-1.12-4.4.59-7.8 4.36-7.8 8.92zM5.6 10.25c0 1.38 1.12 2.5 2.5 2.5.53 0 1.01-.16 1.42-.44l-.02.19c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5l-.02-.19c.4.28.89.44 1.42.44 1.38 0 2.5-1.12 2.5-2.5 0-1-.59-1.85-1.43-2.25.84-.4 1.43-1.25 1.43-2.25 0-1.38-1.12-2.5-2.5-2.5-.53 0-1.01.16-1.42.44l.02-.19C14.5 2.12 13.38 1 12 1S9.5 2.12 9.5 3.5l.02.19c-.4-.28-.89-.44-1.42-.44-1.38 0-2.5 1.12-2.5 2.5 0 1 .59 1.85 1.43 2.25-.84.4-1.43 1.25-1.43 2.25zM12 5.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5S9.5 9.38 9.5 8s1.12-2.5 2.5-2.5zm-8.92 8.7C3.67 18.6 7.44 22 12 22c0-4.56-3.4-8.33-7.8-8.92-.64-.09-1.21.48-1.12 1.12z"/>
      </svg>
    </div>
  </div>

  <script>
    // Apply the app's persisted theme before the engine boots, so the splash
    // matches the theme the user chose (shared_preferences stores keys in
    // localStorage under the "flutter." prefix).
    (function () {
      try {
        // shared_preferences_web stores values JSON-encoded, so the raw entry
        // is '"dark"' — parse it to get the plain mode string.
        var raw = localStorage.getItem('flutter.theme_mode');
        if (raw == null) return;
        var mode = JSON.parse(raw);
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.dataset.theme = mode;
        }
      } catch (e) {}
    })();
  </script>

  <!--
    Register the COOP/COEP service worker first. It lets static hosts like
    GitHub Pages serve a cross-origin isolated app (needed for OPFS-backed
    SQLite). It reloads the page once on the first visit.
  -->
  <script src="coi_init.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide the static splash once Flutter has painted its own identical one
    // (the app's StartupGate splash). A fail-safe timeout never leaves a
    // stuck splash behind if the first-frame event was missed.
    function hideBootSplash() {
      var splash = document.getElementById('boot-splash');
      if (!splash || splash.classList.contains('hide')) return;
      splash.classList.add('hide');
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 400);
    }
    window.addEventListener('flutter-first-frame', hideBootSplash);
    setTimeout(hideBootSplash, 15000);
  </script>
</body>
</html>
