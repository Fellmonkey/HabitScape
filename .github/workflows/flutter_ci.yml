name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer (strict)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --reporter=expanded

      - name: Build web (release)
        # Compiles the PWA target including the JS-interop PNG-share adapter,
        # so web-only code is validated on every CI run.
        run: flutter build web --release
