name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.50.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer (strict)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --reporter=expanded

      - name: Validate service-worker scripts
        run: |
          node --check web/coi_service_worker.js
          node --check web/coi_init.js

      - name: Verify web wiring (service worker, bootstrap, index)
        run: flutter test test/web/service_worker_setup_test.dart
