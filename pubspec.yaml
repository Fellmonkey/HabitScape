name: habitscape
description: ""
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1

  # Database
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # Routing
  go_router: ^18.1.4

  # Utils
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  shared_preferences: ^2.5.3
  hintful: ^2.0.0
  hintful_prefs: ^2.0.0
  url_launcher: ^6.3.1

  # Web DOM interop (PNG export download fallback on the Web PWA)
  web: ^1.1.0

  # Local scheduled notifications (Android, offline, opt-in). No backend:
  # the app is serverless by design, so FCM/Web Push are out of scope.
  flutter_local_notifications: ^23.0.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.4.13
  sqlite3: ^3.9.1
  integration_test:
    sdk: flutter

  # Test runner optimizer: gathers all *_test.dart files into a single entry
  # point (fewer VM spawns) and can split them into shards for local runs.
  coverde: ^0.4.1

  riverpod: any
flutter:
  uses-material-design: true

  # The root CHANGELOG.md is the single source of truth for release notes:
  # it is shown in-app under Settings → About → What's new.
  assets:
    - CHANGELOG.md

  # Nunito & Inter (variable fonts, OFL) — the app's typography system.
  # Both ship as a single variable TTF; TextStyle.fontWeight drives the
  # `wght` variation axis.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz_wght.ttf
